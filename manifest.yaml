# kandev plugin manifest — the single declarative contract between this
# plugin and a kandev host. `id` MUST match the Go module name in go.mod and
# the id passed to window.registerKandevPlugin(...) in ui/bundle.js, and it is
# the prefix of every route kandev serves for this plugin
# (/api/plugins/<id>/...). It also namespaces every plugin_user_state row:
# changing it would strand every saved note. Keep it immutable across releases
# unless a host-backed data migration ships first.
id: "kandev-plugin-notes"
api_version: 1
version: "0.6.0"
display_name: "Notes"
description: "A private, per-user scratchpad note on any task or workspace: a dockview/mobile panel, a sidebar workspace-notes button, markdown editing with a formatting toolbar, AI-assisted proofreading with guided setup, and a kanban card shortcut."
author: "yattdev"
categories: ["tools"]
repo_url: "https://github.com/yattdev/kandev-plugin-notes"

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. The paths are relative to
# the package root and must match what the Makefile writes into server/.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# capabilities gate what the host will do for this plugin. This plugin needs
# per-user browser-reachable storage (host.storage) for the note itself. This
# capability is part of the persistence contract: removing it makes all saved
# notes inaccessible. The plugin also needs
# agent_invoke so the "Enhance with AI" button can run a one-shot proofreading
# completion via Host.InvokeUtilityAgent (see server/plugin.go and the
# `agent_profile` config property below).
capabilities:
  user_state: true
  agent_invoke: true

# webhooks: the "Enhance with AI" button POSTs the note's current markdown to
# this webhook (relayed at POST /api/plugins/kandev-plugin-notes/webhooks/enhance);
# server/plugin.go's HandleWebhook proofreads it via Host.InvokeUtilityAgent
# and returns the improved markdown for the UI's preview/Accept/Discard flow.
webhooks:
  - key: "enhance"
    description: "Proofread and improve the current note's markdown via the configured agent profile"
    method: "POST"

# config_schema: agent_invoke requires an agent_profile picker (rendered at
# Settings > Plugins > Notes) so the operator selects the platform profile
# that runs the enhance completion. Calling Host.InvokeUtilityAgent without a
# valid selection returns a distinguishable FailedPrecondition (see
# server/plugin.go), surfaced by the UI as a non-fatal message.
config_schema:
  type: object
  properties:
    agent_profile: { type: string, format: agent-profile, title: "Agent profile", description: "Agent profile used to proofread notes for the Enhance with AI button" }

# ui.bundle points at the hand-written, no-build ES module frontend half.
ui:
  bundle: "/ui/bundle.js"
