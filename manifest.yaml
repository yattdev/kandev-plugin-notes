# kandev plugin manifest — the single declarative contract between this
# plugin and a kandev host. `id` MUST match the Go module name in go.mod and
# the id passed to window.registerKandevPlugin(...) in ui/bundle.js, and it is
# the prefix of every route kandev serves for this plugin
# (/api/plugins/<id>/...). Keep the three in sync when bumping version.
id: "kandev-plugin-notes"
api_version: 1
version: "0.1.0"
display_name: "Notes"
description: "A private, per-user scratchpad note on any task: a dockview/mobile panel, rich-text editing, and a kanban card shortcut."
author: "yattdev"
categories: ["tools"]
repo_url: "https://github.com/yattdev/kandev-plugin-notes"

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. The paths are relative to
# the package root and must match what the Makefile writes into server/.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# capabilities gate what the host will do for this plugin. This plugin needs
# only per-user browser-reachable storage (host.storage) for the note itself
# — no events, no Host state, no webhooks, no API read/write.
capabilities:
  user_state: true

# ui.bundle points at the hand-written, no-build ES module frontend half.
ui:
  bundle: "/ui/bundle.js"
